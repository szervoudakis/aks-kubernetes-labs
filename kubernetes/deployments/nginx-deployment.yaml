apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx-deployment

spec:
  replicas: 4

  selector:
    matchLabels:
      app: nginx-deployment

  template:
    metadata:
      labels:
        app: nginx-deployment

    spec:
      containers:
        - name: aks-learning-nginx
          image: aks-learning-nginx:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 80